# fine-tuning/config/training_v2.yaml
# One block per (purpose, model). Defaults from docs/e2e/runs/2026-04-13-fine-tuning-plan.md.

entity:
  gliner_large:
    base: urchade/gliner_multitask-large-v0.5
    lr: 1.0e-5
    batch_size: 16
    epochs: 5
    warmup_ratio: 0.1
    weight_decay: 0.01
    max_seq_length: 512
    bf16: true
  gliner_small:
    base: urchade/gliner_small-v2.1
    lr: 2.0e-5
    batch_size: 32
    epochs: 5
    warmup_ratio: 0.1
    weight_decay: 0.01
    max_seq_length: 512
    bf16: true

relation:
  rebel_large:
    base: Babelscape/rebel-large
    lr: 5.0e-5
    batch_size: 16
    epochs: 10
    warmup_steps: 200
    weight_decay: 0.01
    max_source_length: 512
    max_target_length: 128
    bf16: true
    num_beams: 5
  mrebel_base:
    base: Babelscape/mrebel-base
    lr: 5.0e-5
    batch_size: 32
    epochs: 10
    warmup_steps: 200
    weight_decay: 0.01
    max_source_length: 512
    max_target_length: 128
    bf16: true
    num_beams: 5

classifier:
  distilbert:
    base: distilbert-base-uncased
    lr: 2.0e-5
    batch_size: 32
    epochs: 5
    warmup_ratio: 0.1
    weight_decay: 0.01
    max_seq_length: 256
  minilm:
    base: microsoft/MiniLM-L12-H384-uncased
    lr: 3.0e-5
    batch_size: 64
    epochs: 5
    warmup_ratio: 0.1
    weight_decay: 0.01
    max_seq_length: 256
  roberta_large:
    base: roberta-large
    lr: 1.0e-5
    batch_size: 16
    epochs: 4
    warmup_ratio: 0.1
    weight_decay: 0.01
    max_seq_length: 256

embedding:
  qwen3_embedding_06b:
    base: Qwen/Qwen3-Embedding-0.6B
    family: plain
    lr: 2.0e-5
    batch_size: 8
    epochs: 3
    warmup_ratio: 0.1
  embeddinggemma_300m:
    base: google/embeddinggemma-300m
    family: embeddinggemma
    lr: 2.0e-5
    batch_size: 8
    epochs: 3
    warmup_ratio: 0.1
