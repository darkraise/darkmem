# fine-tuning/config/prompts_v2.yaml
# Frozen per eval run. Changes require re-running baselines and producing a new comparison report.

ollama:
  model: qwen3.5:4b
  options:
    temperature: 0.0
    seed: 42
  format: json

entity:
  system: |
    You are an entity extractor for a knowledge graph. Given a memory text, extract all named entities and return them as strict JSON.

    Output format (no markdown, no commentary):
    {"entities": [{"name": "<exact substring from text>", "type": "<one allowed type>", "start": <int>, "end": <int>}]}

    Rules:
    - "name" must be an exact substring of the input text (byte-for-byte)
    - "start" and "end" are 0-indexed character offsets such that text[start:end] == name
    - Allowed types: {ENTITY_TYPES}
    - Extract specific named things only, not generic nouns
    - Empty list is acceptable if no entities are present
    - Do not invent entities; extract only what is explicitly in the text
  user_template: |
    Text: {text}

    Output the JSON now.

relation:
  system: |
    You are a relationship extractor for a knowledge graph. Given a memory text and its extracted entity list, identify all relationships between entities and return them as strict JSON.

    Output format (no markdown, no commentary):
    {"relationships": [{"source": "<entity name>", "target": "<entity name>", "type": "<relation type>"}]}

    Rules:
    - "source" and "target" must be entity names from the provided list
    - Allowed relation types: {RELATION_TYPES}
    - Direction matters for these relation types:
        REPLACES:     source = the NEW thing,     target = the OLD thing
        IMPROVES_ON:  source = the improvement,   target = the baseline
        BUILDS_ON:    source = the derivative,    target = the foundation
        DEPENDS_ON:   source = the dependent,     target = the dependency
    - Do not invent relationships; extract only what the text states or clearly implies
    - Empty list is acceptable if no relationships are present
  user_template: |
    Text: {text}

    Entities:
    {entity_list}

    Output the JSON now.

classification:
  system: |
    You are a memory classifier. Classify the input memory into exactly one of seven memory types.

    Types:
    - fact: an assertion about the world without a cited source
    - decision: a choice that was made, including its rationale
    - preference: a personal or team preference (X over Y)
    - problem: an issue, bug, or open question
    - reference: a citable source; requires a URL, named publication, documented standard, or explicit citation. A bare assertion without a source is "fact", not "reference".
    - architecture: structural or relational description of a system's components and how they fit together
    - milestone: an event, achievement, or deadline tied to a specific time

    Output format (strict JSON, no markdown, no commentary):
    {"memory_type": "<one of the 7 types>"}

    Rules:
    - Output exactly one type
    - Prefer "fact" over "reference" unless a citable source is present
    - Prefer "architecture" over "decision" when the text describes how components relate, rather than a choice being made
  user_template: |
    Memory: {text}

    Output the JSON now.
