name: CI

# No `push` trigger on master. release.yml owns master pushes and calls this
# workflow through `workflow_call`, so keeping a push trigger here would run
# the whole suite twice for every merge.
on:
  pull_request:
  workflow_dispatch:
    inputs:
      runner:
        description: "Verification runner (e2e always uses darkmem-linux); image builds/publishing stay hosted"
        type: choice
        options: [fallback, self-hosted, hosted, auto]
        default: fallback
  # Callable so release.yml can gate publishing on this exact pipeline rather
  # than a copy of it: a release can never publish an image whose tests did not
  # run.
  workflow_call:
    inputs:
      runs-on:
        description: "Verification runs-on (JSON); image build stays hosted and e2e stays self-hosted"
        type: string
        default: ""

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Default (`fallback`): verification on darkmem-linux while a runner is
  # online, queuing when busy, and hosted only when none is online (needs
  # RUNNER_PICKER_TOKEN; without it, queue on self-hosted). Under release.yml
  # the choice passes through.
  # Image builds stay hosted and LAN-dependent e2e stays self-hosted.
  pick-runner:
    name: Pick runner
    runs-on: ubuntu-latest
    outputs:
      runs-on: ${{ steps.pick.outputs.runs-on }}
    steps:
      - uses: actions/checkout@v4
        if: inputs.runs-on == ''
        with:
          sparse-checkout: scripts/pick_runner.py
          sparse-checkout-cone-mode: false
      - name: Pick
        id: pick
        env:
          CALLER_PICK: ${{ inputs.runs-on }}
          REQUESTED: ${{ inputs.runner || 'fallback' }}
          GH_TOKEN: ${{ secrets.RUNNER_PICKER_TOKEN }}
        run: |
          if [ -n "$CALLER_PICK" ]; then
            echo "runs-on=$CALLER_PICK" >> "$GITHUB_OUTPUT"
            echo "Runner: \`$CALLER_PICK\` (picked by the calling workflow)" >> "$GITHUB_STEP_SUMMARY"
          else
            python3 scripts/pick_runner.py
          fi

  backend:
    name: Backend (${{ matrix.suite }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: app 1/3
            shard: 1/3
          - suite: app 2/3
            shard: 2/3
          - suite: app 3/3
            shard: 3/3
          - suite: harness
            shard: harness
    needs: pick-runner
    runs-on: ${{ fromJSON(needs.pick-runner.outputs.runs-on) }}
    # A job container, like the e2e jobs: actions/setup-python has no build
    # for the darkmem-linux runners' OS, so a host job died before any test
    # ran. The container also gives each job a private network, so Postgres
    # publishes no host port at all. The harness suite refuses to share a
    # database with the app tests, so it gets its own (benchlib/bench_db.py).
    container: python:3.12-bookworm
    services:
      postgres:
        image: pgvector/pgvector:0.8.2-pg17
        env:
          POSTGRES_DB: darkmem
          POSTGRES_USER: darkmem
          POSTGRES_PASSWORD: darkmem
        options: >-
          --health-cmd "pg_isready -U darkmem"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://darkmem:darkmem@postgres:5432/darkmem
      TEST_DATABASE_URL: postgresql+asyncpg://darkmem:darkmem@postgres:5432/darkmem_test
      BENCH_DATABASE_URL: postgresql+asyncpg://darkmem:darkmem@postgres:5432/darkmem_bench
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      # tests/test_planning_docs.py reads the canonical planning documents from
      # master. A branch build has that ref; a build of a *tag* is a detached
      # HEAD that has neither `master` nor `origin/master`, and every one of
      # those checks then failed on "invalid object name 'master'" rather than
      # on anything about the documents. Fetch the branch so a tag build asks
      # the same question a branch build does.
      # The checkout is owned by the runner user and the container runs as
      # root, so git refuses the repository until it is marked safe.
      - name: Fetch the master ref the planning checks read
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git fetch --no-tags --depth=1 origin +refs/heads/master:refs/remotes/origin/master
      # A virtualenv under RUNNER_TEMP, which the runner empties for every
      # job, so pip never keeps a package the lock dropped and tests cannot
      # import what the image no longer ships.
      - name: Install (pinned)
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
          PATH="$RUNNER_TEMP/venv/bin:$PATH"
          python -m pip install --upgrade pip
          pip install -r requirements.lock
          pip install --no-deps .
          pip install pytest pytest-asyncio ruff
      # The container has no psql or docker CLI; asyncpg comes from the lock.
      - name: Create test databases
        run: |
          python - <<'PY'
          import asyncio, asyncpg
          async def main():
              conn = await asyncpg.connect("postgresql://darkmem:darkmem@postgres:5432/darkmem")
              for name in ("darkmem_test", "darkmem_bench"):
                  await conn.execute(f"CREATE DATABASE {name}")
              await conn.close()
          asyncio.run(main())
          PY
      - name: Lint (ruff, advisory)
        run: ruff check app/ --select F --output-format=github
        continue-on-error: true
      # Each matrix job owns its Postgres service. Never run concurrent pytest
      # processes against one database: session fixtures reset its schema.
      - name: Check shard coverage
        if: matrix.shard == '1/3'
        run: python -m unittest discover -s ../scripts/tests -p 'test_ci_pytest.py'
      - name: Test
        if: matrix.shard != 'harness'
        env:
          TEST_SHARD: ${{ matrix.shard }}
        run: python ../scripts/ci_pytest.py --shard "$TEST_SHARD" -q --durations=20 tests
      # pyproject sets testpaths = ["tests"], so the line above does NOT collect
      # the harness suite. Run it explicitly or the eval harness can break while
      # the floor stays green.
      - name: Harness tests
        if: matrix.shard == 'harness'
        run: python -m pytest -q --durations=20 scripts/benchlib/tests
      # Installs and test output are root-owned inside the job container.
      # Return ownership to the runner so its next host job can clean this
      # checkout.
      - name: Restore runner workspace ownership
        if: always()
        run: chown -R "$(stat -c '%u:%g' "$GITHUB_WORKSPACE/..")" "$GITHUB_WORKSPACE" "$RUNNER_TEMP"

  frontend:
    name: Frontend (types + lint + build)
    needs: pick-runner
    runs-on: ${{ fromJSON(needs.pick-runner.outputs.runs-on) }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      # Major line only, from frontend/.nvmrc; check-latest stays off, so a
      # self-hosted runner reuses the Node 20.x already in its tool cache
      # instead of downloading every new patch (tests/test_ci_workflows.py).
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
        continue-on-error: true
      # Typecheck already ran above; npm run build would run tsc a second time.
      - name: Build
        run: npx vite build

  frontend-tests:
    name: Frontend tests (${{ matrix.shard }}/4)
    needs: pick-runner
    runs-on: ${{ fromJSON(needs.pick-runner.outputs.runs-on) }}
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # Vitest partitions the complete discovered suite; isolation, timeouts,
      # and the per-runner worker cap remain unchanged.
      - name: Unit tests
        env:
          TEST_SHARD: ${{ matrix.shard }}/4
        run: npx vitest run --shard="$TEST_SHARD"

  # Build on GitHub-hosted, then transfer this exact image to the smoke job.
  # No registry push occurs until the entire reusable workflow succeeds.
  images:
    name: Build & scan image
    runs-on: ubuntu-latest
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      image: ${{ steps.image.outputs.image }}
    env:
      IMAGE: darkmem:ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Record image reference
        id: image
        run: echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: ${{ env.IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}
          severity: HIGH,CRITICAL
          exit-code: "0"   # advisory until the dependency tree is triaged; flip to "1" to enforce
          ignore-unfixed: true
      - name: Export image
        run: docker save "$IMAGE" -o "$RUNNER_TEMP/darkmem-image.tar"
      - name: Upload image for verification
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: darkmem-image-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/darkmem-image.tar
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

  image-smoke:
    name: Boot & verify image
    needs: [pick-runner, images]
    runs-on: ${{ fromJSON(needs.pick-runner.outputs.runs-on) }}
    env:
      IMAGE: ${{ needs.images.outputs.image }}
      # Download by artifact ID, so re-running just this failed job still
      # loads the successful build's image and its original attempt's tag.
      SMOKE: darkmem-smoke-${{ github.run_id }}-${{ github.run_attempt }}
    services:
      postgres:
        image: pgvector/pgvector:0.8.2-pg17
        env:
          POSTGRES_DB: darkmem
          POSTGRES_USER: darkmem
          POSTGRES_PASSWORD: darkmem
        ports:
          - 5432
        options: >-
          --health-cmd "pg_isready -U darkmem"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - name: Download built image
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.images.outputs.artifact-id }}
          merge-multiple: true
          path: ${{ runner.temp }}/image
      - name: Load image
        run: |
          docker load -i "$RUNNER_TEMP/image/darkmem-image.tar"
      # An image that builds and cannot boot is the failure a registry push
      # makes permanent, so prove it boots before a tag is ever allowed to
      # publish it. This exercises the real entrypoint: alembic upgrade, then
      # the schema-baseline guard, then uvicorn answering /health.
      - name: Boot the image and probe /health
        run: |
          # Joins the service's own network rather than the host's, so the
          # probe can only ever reach this container, never whatever else
          # listens on the runner's :8000.
          docker run -d --name "$SMOKE" \
            --network "${{ job.services.postgres.network }}" \
            -p 127.0.0.1::8000 \
            -e ENVIRONMENT=production \
            -e DB_HOST=postgres -e DB_PORT=5432 \
            -e DB_USER=darkmem -e DB_NAME=darkmem -e DB_PASSWORD=darkmem \
            -e JWT_SECRET=ci-only-secret-not-used-anywhere-else-0123456789 \
            -e COOKIE_SECURE=false \
            "$IMAGE"
          PORT=$(docker port "$SMOKE" 8000/tcp | head -n1 | sed 's/.*://')
          [ -n "$PORT" ] || { echo "::error::the smoke container published no port"; docker logs "$SMOKE"; exit 1; }
          for i in $(seq 1 60); do
            if curl -fsS "http://127.0.0.1:$PORT/health" >/dev/null 2>&1; then
              echo "healthy after ${i}s"
              curl -fsS "http://127.0.0.1:$PORT/health"
              # The SPA ships inside this image; an API-only image is a
              # half-built artifact that /health alone would not catch.
              curl -fsS -o /dev/null -w 'index=%{http_code}\n' "http://127.0.0.1:$PORT/"
              exit 0
            fi
            sleep 1
          done
          echo "::error::image did not answer /health within 60s"
          docker logs "$SMOKE"
          exit 1
      - name: Container logs (always)
        if: always()
        run: docker logs "$SMOKE" || true
      - name: Stop the container
        if: always()
        run: docker rm -f "$SMOKE" || true

      - name: Remove the image
        if: always()
        run: docker rmi "$IMAGE" || true

  # These suites need the LAN model endpoint, so never fall back to hosted.
  # Job containers isolate the harness's fixed API/Vite ports per runner job.
  e2e:
    name: E2E (${{ matrix.suite }})
    runs-on: [self-hosted, linux, x64, darkmem-linux]
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        suite: [api, playwright]
    container: python:3.12-bookworm
    services:
      postgres:
        image: pgvector/pgvector:0.8.2-pg17
        env:
          POSTGRES_DB: darkmem_e2e
          POSTGRES_USER: darkmem
          POSTGRES_PASSWORD: darkmem
        options: >-
          --health-cmd "pg_isready -U darkmem -d darkmem_e2e"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://darkmem:darkmem@postgres:5432/darkmem_e2e
      DATABASE_URL: postgresql+asyncpg://darkmem:darkmem@postgres:5432/darkmem_e2e
      DARKMEM_OLLAMA_BASE_URL: ${{ vars.DARKMEM_OLLAMA_BASE_URL || 'http://192.168.0.196:11434/v1' }}
      ENVIRONMENT: development
      COOKIE_SECURE: "false"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Install backend (pinned)
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
          PATH="$RUNNER_TEMP/venv/bin:$PATH"
          python -m pip install --upgrade pip
          pip install -r requirements.lock
          pip install --no-deps .
          pip install pytest pytest-asyncio
      - uses: actions/setup-node@v4
        if: matrix.suite == 'playwright'
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend and Chromium
        if: matrix.suite == 'playwright'
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: API e2e (disposable stack)
        if: matrix.suite == 'api'
        run: python scripts/e2e/run_e2e.py
      - name: Playwright e2e (disposable stack)
        if: matrix.suite == 'playwright'
        run: python scripts/e2e/run_playwright_e2e.py
      - name: Upload Playwright failure traces
        if: always() && matrix.suite == 'playwright'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: frontend/test-results/
          retention-days: 7
          if-no-files-found: ignore
      # Installs/test output are root-owned inside the job container. Return
      # ownership to the runner so its next host job can clean this checkout.
      - name: Restore runner workspace ownership
        if: always()
        run: chown -R "$(stat -c '%u:%g' "$GITHUB_WORKSPACE/..")" "$GITHUB_WORKSPACE" "$RUNNER_TEMP"
