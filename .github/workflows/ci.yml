name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
  # Callable so release.yml can gate publishing on this exact pipeline rather
  # than a copy of it: a tag can never publish an image whose tests did not run.
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.2-pg17
        env:
          POSTGRES_DB: darkmem
          POSTGRES_USER: darkmem
          POSTGRES_PASSWORD: darkmem
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U darkmem"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://darkmem:darkmem@localhost:5433/darkmem
      TEST_DATABASE_URL: postgresql+asyncpg://darkmem:darkmem@localhost:5433/darkmem_test
      # The harness suite refuses to share a database with the app tests, so it
      # gets its own (benchlib/bench_db.py).
      BENCH_DATABASE_URL: postgresql+asyncpg://darkmem:darkmem@localhost:5433/darkmem_bench
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (pinned)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock
          pip install --no-deps .
          pip install pytest pytest-asyncio ruff
      - name: Create test databases
        run: |
          PGPASSWORD=darkmem psql -h localhost -p 5433 -U darkmem -d darkmem \
            -c "CREATE DATABASE darkmem_test;" -c "CREATE DATABASE darkmem_bench;"
      - name: Lint (ruff, advisory)
        run: ruff check app/ --select F --output-format=github
        continue-on-error: true
      - name: Test
        run: python -m pytest -q
      # pyproject sets testpaths = ["tests"], so the line above does NOT collect
      # the harness suite. Run it explicitly or the eval harness can break while
      # the floor stays green.
      - name: Harness tests
        run: python -m pytest -q scripts/benchlib/tests

  frontend:
    name: Frontend (tsc + vitest + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
        continue-on-error: true
      - name: Unit tests
        run: npx vitest run
      - name: Build
        run: npm run build

  # One image, built from the repo root: it carries the API and the built SPA
  # together. This job used to build two (./backend and ./frontend) and had
  # been broken since the consolidation -- backend/ has no Dockerfile at all.
  #
  # It builds, boots and scans, but never pushes. Publishing is release.yml's
  # and happens only on a tag.
  images:
    name: Build, boot & scan image
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      postgres:
        image: pgvector/pgvector:0.8.2-pg17
        env:
          POSTGRES_DB: darkmem
          POSTGRES_USER: darkmem
          POSTGRES_PASSWORD: darkmem
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U darkmem"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: darkmem:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # An image that builds and cannot boot is the failure a registry push
      # makes permanent, so prove it boots before a tag is ever allowed to
      # publish it. This exercises the real entrypoint: alembic upgrade, then
      # the schema-baseline guard, then uvicorn answering /health.
      - name: Boot the image and probe /health
        run: |
          docker run -d --name darkmem-smoke --network host \
            -e ENVIRONMENT=production \
            -e DB_HOST=localhost -e DB_PORT=5433 \
            -e DB_USER=darkmem -e DB_NAME=darkmem -e DB_PASSWORD=darkmem \
            -e JWT_SECRET=ci-only-secret-not-used-anywhere-else-0123456789 \
            -e COOKIE_SECURE=false \
            darkmem:ci
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/health >/dev/null 2>&1; then
              echo "healthy after ${i}s"
              curl -fsS http://127.0.0.1:8000/health
              # The SPA ships inside this image; an API-only image is a
              # half-built artifact that /health alone would not catch.
              curl -fsS -o /dev/null -w 'index=%{http_code}\n' http://127.0.0.1:8000/
              exit 0
            fi
            sleep 1
          done
          echo "::error::image did not answer /health within 60s"
          docker logs darkmem-smoke
          exit 1
      - name: Container logs (always)
        if: always()
        run: docker logs darkmem-smoke || true
      - name: Stop the container
        if: always()
        run: docker rm -f darkmem-smoke || true

      - name: Scan image (Trivy)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: darkmem:ci
          severity: HIGH,CRITICAL
          exit-code: "0"   # advisory until the dependency tree is triaged; flip to "1" to enforce
          ignore-unfixed: true
