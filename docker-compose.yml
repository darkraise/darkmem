services:
  darkmem-api:
    image: darkraise/darkmem-api:latest
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://darkmem:${DB_PASSWORD}@postgres:5432/darkmem
      - JWT_SECRET=${JWT_SECRET}
      - API_KEY_HMAC_SECRET=${API_KEY_HMAC_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512m

  darkmem-ui:
    image: darkraise/darkmem-ui:latest
    ports:
      - "3000:80"
    depends_on:
      - darkmem-api
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:0.8.2-pg17
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=darkmem
      - POSTGRES_USER=darkmem
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "darkmem" ]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
