# Both compose files otherwise default their project name to the directory,
# `darkmem` — so `docker compose up -d` here RECREATED the dev stack's
# containers and pointed the production API at the development database, which
# is where pytest's `darkmem_test` lives. Found on 2026-08-10 cutting v0.1:
# the dev Postgres was recreated under host networking, moving it off :5433 and
# taking the backend floor down with it. Nothing was lost, because both files
# happened to name the same volume — which is the other half of the defect, not
# a mitigation. An explicit name gives production its own containers and its own
# volume, and lets both stacks run at once.
name: darkmem-prod

services:
  # One image, and it is the network edge: it serves the REST API, /mcp, /ws
  # and the built SPA on :8000. Nothing binds :80 any more. The name is
  # historical -- it predates the SPA moving in -- and is kept because
  # renaming would orphan every pinned DARKMEM_VERSION an operator deployed.
  darkmem-api:
    image: darkraise/darkmem-api:${DARKMEM_VERSION:-latest}
    init: true
    # Host networking: the API binds directly to the host's :8000 (LAN + UI +
    # MCP /mcp). No Docker service-name DNS, so DB_HOST below points at
    # localhost.
    #
    # The login rate limiter keys on the transport peer (trust_proxy_headers
    # defaults off, and the entrypoint passes --no-proxy-headers), which is
    # only the real LAN client BECAUSE of host networking. Moving to bridge
    # networking changes where the peer address comes from and must be
    # measured before, not after: with a non-loopback peer in front, uvicorn
    # stops trusting it, request.client.host becomes the proxy's own address
    # for every request, and five failures from any client lock out the LAN.
    network_mode: host
    # Port mappings are ignored under host networking; kept for bridge reference:
    # ports:
    #   - "8000:8000"
    environment:
      # Arms the fail-fast validators (JWT strength, SETUP_SECRET) and the
      # Secure-cookie default. Keep this 'production'.
      - ENVIRONMENT=production
      # Database connection. Under host networking Postgres is on the host's
      # loopback, so DB_HOST defaults to localhost (override in .env for an
      # external Postgres). config.py builds DATABASE_URL from these.
      - DB_HOST=${DB_HOST:-localhost}
      - DB_PORT=${DB_PORT:-5432}
      - DB_USER=${DB_USER:-darkmem}
      - DB_NAME=${DB_NAME:-darkmem}
      - DB_PASSWORD=${DB_PASSWORD:?set DB_PASSWORD in .env — see .env.example}
      - JWT_SECRET=${JWT_SECRET:?set JWT_SECRET in .env — see .env.example}
      # The session cookie is HTTPS-only by default; set COOKIE_SECURE=false in
      # .env to allow login over plain HTTP on a trusted LAN.
      - COOKIE_SECURE=${COOKIE_SECURE:-true}
      # Which layer decides the login rate limiter's bucket. Off = the
      # transport peer, which is right when this app is the edge. Set true
      # only when a trusted proxy really is in front, or every client shares
      # that proxy's bucket. Passed through so changing posture stays a
      # config flip rather than an edit to this file.
      - TRUST_PROXY_HEADERS=${TRUST_PROXY_HEADERS:-false}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      # Hosts allowed to reach /mcp (DNS-rebinding allowlist). Empty = localhost
      # only; set your LAN host:port (e.g. 192.168.0.195:8000) so agents can
      # connect, or "*" to disable the host check.
      - MCP_ALLOWED_HOSTS=${MCP_ALLOWED_HOSTS:-}
    volumes:
      # Persist cloned repositories across container restarts.
      - repo_data:/app/data/repositories
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=5).status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          # Raised from 512m: code indexing loads file text + tree-sitter ASTs;
          # 512m OOM-killed large-repo reindexes. Tune to your largest repo.
          memory: 1g
          cpus: "1.5"

  postgres:
    image: pgvector/pgvector:0.8.2-pg17
    network_mode: host
    # Host networking puts Postgres on the host's :5432. listen_addresses pins
    # it to loopback so it is NOT reachable from the LAN.
    # max_connections sized for the API pool (30/process) plus headroom.
    command: ["postgres", "-c", "max_connections=120", "-c", "listen_addresses=127.0.0.1"]
    # Port mapping is ignored under host networking; kept for bridge reference
    # (it bound the host's loopback :5433 to the container's :5432):
    # ports:
    #   - "127.0.0.1:5433:5432"
    # pgvector index builds and parallel scans use /dev/shm; the 64MB container
    # default can trip "could not resize shared memory segment".
    shm_size: 256mb
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      # Kept in sync with the API's DB_* so the credentials always match.
      - POSTGRES_DB=${DB_NAME:-darkmem}
      - POSTGRES_USER=${DB_USER:-darkmem}
      - POSTGRES_PASSWORD=${DB_PASSWORD:?set DB_PASSWORD in .env — see .env.example}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-darkmem}"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1g

volumes:
  postgres_data:
  repo_data:
