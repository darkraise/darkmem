services:
  darkmem-api:
    image: darkraise/darkmem-api:${DARKMEM_VERSION:-latest}
    init: true
    # Host networking: the API binds directly to the host's :8000 (LAN + MCP
    # /mcp). No Docker service-name DNS, so DB_HOST below points at localhost.
    network_mode: host
    # Port mappings are ignored under host networking; kept for bridge reference:
    # ports:
    #   - "8000:8000"
    environment:
      # Arms the fail-fast validators (JWT strength, SETUP_SECRET) and the
      # Secure-cookie default. Keep this 'production'.
      - ENVIRONMENT=production
      # Database connection. Under host networking Postgres is on the host's
      # loopback, so DB_HOST defaults to localhost (override in .env for an
      # external Postgres). config.py builds DATABASE_URL from these.
      - DB_HOST=${DB_HOST:-localhost}
      - DB_PORT=${DB_PORT:-5432}
      - DB_USER=${DB_USER:-darkmem}
      - DB_NAME=${DB_NAME:-darkmem}
      - DB_PASSWORD=${DB_PASSWORD:?set DB_PASSWORD in .env — see .env.example}
      - JWT_SECRET=${JWT_SECRET:?set JWT_SECRET in .env — see .env.example}
      # The session cookie is HTTPS-only by default; set COOKIE_SECURE=false in
      # .env to allow login over plain HTTP on a trusted LAN.
      - COOKIE_SECURE=${COOKIE_SECURE:-true}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      # Persist cloned repositories across container restarts.
      - repo_data:/app/data/repositories
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=5).status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          # Raised from 512m: code indexing loads file text + tree-sitter ASTs;
          # 512m OOM-killed large-repo reindexes. Tune to your largest repo.
          memory: 1g
          cpus: "1.5"

  darkmem-ui:
    image: darkraise/darkmem-ui:${DARKMEM_VERSION:-latest}
    init: true
    # Host networking: nginx binds the host's :80 directly. (To serve on :3000,
    # change `listen 80` to `listen 3000` in frontend/nginx.conf and rebuild.)
    # The session cookie is Secure-only unless COOKIE_SECURE=false.
    network_mode: host
    # Port mapping is ignored under host networking; kept for bridge reference:
    # ports:
    #   - "3000:80"
    depends_on:
      darkmem-api:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128m
          cpus: "0.5"

  postgres:
    image: pgvector/pgvector:0.8.2-pg17
    network_mode: host
    # Host networking puts Postgres on the host's :5432. listen_addresses pins
    # it to loopback so it is NOT reachable from the LAN.
    # max_connections sized for the API pool (30/process) plus headroom.
    command: ["postgres", "-c", "max_connections=120", "-c", "listen_addresses=127.0.0.1"]
    # Port mapping is ignored under host networking; kept for bridge reference
    # (it bound the host's loopback :5433 to the container's :5432):
    # ports:
    #   - "127.0.0.1:5433:5432"
    # pgvector index builds and parallel scans use /dev/shm; the 64MB container
    # default can trip "could not resize shared memory segment".
    shm_size: 256mb
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      # Kept in sync with the API's DB_* so the credentials always match.
      - POSTGRES_DB=${DB_NAME:-darkmem}
      - POSTGRES_USER=${DB_USER:-darkmem}
      - POSTGRES_PASSWORD=${DB_PASSWORD:?set DB_PASSWORD in .env — see .env.example}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-darkmem}"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1g

volumes:
  postgres_data:
  repo_data:
