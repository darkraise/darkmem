services:
  darkmem-api:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://darkmem:${DB_PASSWORD:-darkmem}@postgres:5432/darkmem
      - TEST_DATABASE_URL=postgresql+asyncpg://darkmem:${DB_PASSWORD:-darkmem}@postgres:5432/darkmem_test
    volumes:
      - ./backend/app:/app/app
    depends_on:
      postgres:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --timeout-keep-alive 75

  darkmem-ui:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - darkmem-api

  postgres:
    image: pgvector/pgvector:0.8.2-pg17
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=darkmem
      - POSTGRES_USER=darkmem
      - POSTGRES_PASSWORD=${DB_PASSWORD:-darkmem}
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "darkmem"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
