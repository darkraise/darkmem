services:
  darkmem:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      # ENVIRONMENT is unset → 'development' (relaxed validators, insecure
      # cookie). config.py derives DATABASE_URL from DB_HOST/DB_PORT/DB_USER/
      # DB_PASSWORD/DB_NAME; DB_HOST points at the bundled postgres service.
      - DB_HOST=${DB_HOST:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-darkmem}
      - TEST_DATABASE_URL=postgresql+asyncpg://darkmem:${DB_PASSWORD:-darkmem}@postgres:5432/darkmem_test
      - ATTACHMENTS_DIR=/app/data/attachments
    volumes:
      - ./backend/app:/app/app
      # Page attachments, as in prod: named rather than bound, so Docker
      # copies the image's ownership of the directory into a fresh volume.
      - attachment_data:/app/data/attachments
    depends_on:
      postgres:
        condition: service_healthy
    # Overrides the entrypoint, so it must repeat --no-proxy-headers: the flag
    # is independent of --reload, and dev disagreeing with prod about which
    # layer decides the peer address is how the posture drifts.
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --timeout-keep-alive 75 --no-proxy-headers

  # No separate UI service: dev serves the UI from vite on :3636
  # (cd frontend && npm run dev), which proxies /api, /health and /ws to :8000.

  postgres:
    image: pgvector/pgvector:0.8.2-pg17
    ports:
      - "127.0.0.1:5433:5432"
    shm_size: 256mb
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=darkmem
      - POSTGRES_USER=darkmem
      - POSTGRES_PASSWORD=${DB_PASSWORD:-darkmem}
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "darkmem"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
  attachment_data:
