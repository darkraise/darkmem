[project]
name = "darkmem"
version = "1.17.0"
description = "Centralized memory system for AI agents"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "psutil>=5.9.0",
    "pynvml>=11.5.0",
    "httpx>=0.28.0",
    "pgvector>=0.3.6",
    "mcp>=2.1.1,<3",
    "pyjwt>=2.9.0",
    "bcrypt>=4.0.0",
    "tree-sitter>=0.23.0",
    "tree-sitter-python>=0.23.0",
    "tree-sitter-javascript>=0.23.0",
    "tree-sitter-typescript>=0.23.0",
    "tree-sitter-go>=0.23.0",
    "tree-sitter-rust>=0.23.0",
    "tree-sitter-c-sharp>=0.23.0",
    "tree-sitter-cpp>=0.23.0",
    "tree-sitter-c>=0.24.0",
    "tree-sitter-java>=0.23.0",
    "tree-sitter-ruby>=0.23.0",
    "tree-sitter-php>=0.24.0",
    "tree-sitter-bash>=0.25.0",
    "tree-sitter-html>=0.23.0",
    "tree-sitter-css>=0.25.0",
    "tree-sitter-json>=0.24.0",
    "tree-sitter-scala>=0.24.0",
    "tree-sitter-haskell>=0.23.0",
    "tree-sitter-kotlin>=1.0.0",
    "tree-sitter-swift>=0.0.1",
    "tree-sitter-lua>=0.5.0",
    "tree-sitter-toml>=0.7.0",
    "tree-sitter-yaml>=0.7.0",
    "tree-sitter-sql>=0.3.0",
    "tree-sitter-julia>=0.23.0",
    "tree-sitter-ocaml>=0.24.0",
    "tree-sitter-zig>=1.0.0",
    "tree-sitter-elixir>=0.3.0",
    "tree-sitter-xml>=0.7.0",
    "tree-sitter-regex>=0.25.0",
    "tree-sitter-cmake>=0.7.0",
    "tree-sitter-make>=1.0.0",
    "tree-sitter-objc>=3.0.0",
    "tree-sitter-markdown>=0.5.0",
    "python-igraph>=0.11.0",
    "leidenalg>=0.10.0",
    "scikit-learn>=1.5.0",
    "croniter>=2.0.0",
    # UUIDv7 (doc 04 §2). stdlib uuid.uuid7 is 3.14+, and requires-python is
    # >=3.12 — raising that floor is a toolchain migration (image, universal
    # lock, every wheel), not this dependency's worth of change. app/utils/ids.py
    # is the single call site, so a later floor raise is a one-line swap.
    "uuid6>=2024.7.10",
    # Document parser stack (doc 16 §3 ADR, TH1.03): markdown-it-py for
    # markdown, pure Python and permissively licensed. No PDF parser ships;
    # both doors carry text.
    "markdown-it-py>=3.0.0",
    # The S3 backup destination (spec §9.2). One client covers AWS, R2, B2 and
    # MinIO through `endpoint_url`, which is why a hand-rolled SigV4 signer is
    # not worth writing. The SDK is synchronous and is therefore only ever
    # called through `asyncio.to_thread` -- never on the event loop, which a
    # single worker (invariant 13) cannot afford to block on an upload.
    "boto3>=1.35.0",
]

# Setuptools' flat-layout auto-discovery refuses a directory holding more than
# one top-level package, and `backend/` holds `app`, `migrations`, `tests` and
# `scripts`. The Dockerfile never hit it because it copies only `backend/app/`
# before installing; anything installing from a full checkout -- CI, or a
# contributor running `pip install -e .` -- did. Naming the package makes both
# environments resolve identically.
[tool.setuptools.packages.find]
include = ["app*"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-xdist>=3.6.0",
]
# CPU-only torch + transformers for the in-process classifier (classifier_kind=local).
ml = [
    "transformers>=4.40.0",
    "torch>=2.2.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
