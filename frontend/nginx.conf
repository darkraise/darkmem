# NOT BUILT BY DEFAULT. This is the nginx-in-image fallback of doc 03 section
# 3.2, kept as the written record of the header, gzip and cache policy the app
# now re-implements itself (backend/app/main.py serves the SPA and emits these
# same values). The shipped stack has no darkmem-ui service and nothing binds
# :80; take this only under that doc's named trigger, and rebuild it by hand
# from ./frontend.
#
# Divergence to know before you take it: nginx appends its four `always`
# headers AFTER the app has already set its own, so every /api/* response in
# this posture carries each security header twice. The values are identical --
# the CSP intersects to itself and the policy is unchanged -- but some browsers
# historically ignore a duplicated X-Frame-Options entirely. Setting them only
# if absent does not fix it, because nginx appends after the app. The fix, if
# ever wanted, is to move the four add_header lines below into the
# SPA-serving locations only (`location /assets/`, `location = /index.html`,
# `location /`), leaving the proxied locations to inherit the app's.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # --- Security headers (applied to every response, incl. errors) ---
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # CSP tuned for the Vite bundle (no inline scripts; WebGL/canvas graph libs use
    # blob workers; styles are inlined by the component lib). Validate against the
    # running app if you add features. HSTS belongs on your TLS-terminating proxy.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' ws: wss:; object-src 'none'; frame-ancestors 'none'; base-uri 'self'" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Large memory/code-ingest POSTs flow through here.
    client_max_body_size 25m;

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ws {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        # Long-lived pipeline event stream; nginx default 60s drops idle sockets.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # The SPA polls /health (the Maintenance panel's service indicators). It
    # lives at the API root, not under /api, so proxy it explicitly — otherwise
    # it falls through to the SPA fallback below and returns index.html, and the
    # health query fails (showing every service offline). Mirrors the Vite proxy.
    location = /health {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # NOTE: /mcp is intentionally NOT proxied here. The MCP tool endpoint is
    # unauthenticated (local-network trust model); AI agents reach the API's
    # :8000 directly -- loopback always, and LAN hosts when named in
    # MCP_ALLOWED_HOSTS -- gated by the Host allowlist, not by this proxy.
    # Not proxying it keeps the tool surface off the browser-facing UI origin
    # on :80; the API binds 0.0.0.0, so :8000 itself is LAN-reachable by design.

    # Content-hashed assets are immutable; cache hard. index.html must not cache.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
