server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # --- Security headers (applied to every response, incl. errors) ---
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # CSP tuned for the Vite bundle (no inline scripts; WebGL/canvas graph libs use
    # blob workers; styles are inlined by the component lib). Validate against the
    # running app if you add features. HSTS belongs on your TLS-terminating proxy.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' ws: wss:; object-src 'none'; frame-ancestors 'none'; base-uri 'self'" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Large memory/code-ingest POSTs flow through here.
    client_max_body_size 25m;

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ws {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        # Long-lived pipeline event stream; nginx default 60s drops idle sockets.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # NOTE: /mcp is intentionally NOT proxied here. The MCP tool endpoint is
    # unauthenticated (local-network-only model); AI agents reach it via the
    # loopback-bound API directly (http://127.0.0.1:8000/mcp). Proxying it through
    # the UI would re-expose an unauthenticated tool surface to the network.

    # Content-hashed assets are immutable; cache hard. index.html must not cache.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
